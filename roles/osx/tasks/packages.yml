---
- name: Install useful command tools
  community.general.homebrew:
    name:
      - 1password-cli
      - ack
      - automake
      - azure-cli
      - bash
      - cmake
      - coreutils
      - curl
      - diffutils
      - direnv
      - dos2unix
      - expect
      - gcc
      - gh
      - git
      - gnupg
      - graphviz
      - htop
      - inlyne
      - iperf3
      - jq
      - keychain
      - m4
      - make
      - nvm
      - pass
      - pinentry
      - pinentry-mac
      - protobuf
      - pyenv
      - rbenv
      - skopeo
      - telnet
      - tmux
      - tree
      - wget
      - ykman
      - zsh-completions
    state: latest

- name: Install k8s tools
  community.general.homebrew:
    name:
      - k9s
      - kubernetes-cli
    state: latest

- name: Install useful apps
  community.general.homebrew_cask:
    name:
      - firefox
      - iterm2
      - jetbrains-toolbox
      - multipass
      - obsidian
      - visual-studio-code
    state: present

- name: Create NVM directory
  ansible.builtin.file:
    path: "{{ lookup('env','HOME') }}/.nvm"
    state: directory
    recurse: true
    owner: "{{ ansible_user_id }}"
    group: staff
