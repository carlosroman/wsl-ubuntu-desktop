---
- name: A playbook to setup my local machine with my basic customizations
  hosts: localhost
  gather_facts: false

  pre_tasks:
    - name: Collect system facts
      ansible.builtin.setup:
        gather_subset:
          - '!all'
          - '!min'
          - date_time
          - distribution
          - env
          - lsb  # Linux Standard Base (LSB)
          - os_family  # Distribution
          - system  # Architecture
          - user
      tags:
        - always

    - name: Load Linux vars
      ansible.builtin.include_vars: linux.yml
      when: ansible_system == 'Linux'
      tags:
        - always

    - name: Load OSX vars
      ansible.builtin.include_vars: osx.yml
      when: ansible_system == 'Darwin'
      tags:
        - always

    - name: Check if op CLI is available
      ansible.builtin.command: op --version
      register: op_check
      changed_when: false
      failed_when: false

    - name: Fetch SSH keys from 1Password
      ansible.builtin.set_fact:
        ssh:
          id_rsa:
            prvt: "{{ lookup('community.general.onepassword', 'linux-ssh-key', field='id_rsa', vault=op_vault) }}"
            pub: "{{ lookup('community.general.onepassword', 'linux-ssh-key', field='id_rsa.pub', vault=op_vault) }}"
      when:
        - op_check.rc == 0
        - ansible_system == 'Linux'
      ignore_errors: true

    - name: Fetch SSH keys from 1Password (macOS)
      ansible.builtin.set_fact:
        ssh:
          id_rsa:
            prvt: "{{ lookup('community.general.onepassword', 'osx-ssh-key', field='id_rsa', vault=op_vault) }}"
            pub: "{{ lookup('community.general.onepassword', 'osx-ssh-key', field='id_rsa.pub', vault=op_vault) }}"
      when:
        - op_check.rc == 0
        - ansible_system == 'Darwin'
      ignore_errors: true

    - name: Warn if 1Password CLI is not available
      ansible.builtin.debug:
        msg: "WARNING: 'op' CLI not found or not configured. SSH keys will not be set up."
      when: op_check.rc != 0

  roles:
    - {role: debug, tags: [debug]}
    - {role: sudoers, tags: [sudo]}
    - {role: ssh, tags: [ssh], when: ssh.id_rsa.prvt | length > 0}
    - {role: packages, tags: [packages]}
    - {role: dot, tags: [dot, bash]}
    - {role: wsl, tags: [wsl]}
    - {role: osx, tags: [osx]}
    - {role: gui, tags: [gui]}
    - {role: docker, tags: [docker]}
    - {role: vscode, tags: [vscode]}
    - {role: limits, tags: [limits]}
    - {role: chrome, tags: [chrome]}
    - {role: golang, tags: [golang]}
    - {role: rust, tags: [rust]}
    - {role: nvidia-cuda, tags: [nvidia-cuda]}
    - {role: keepassxc, tags: [keepassxc]}
    - role: carlosroman.amd_rocm
      tags: [amd-rocm]
      vars:
        amd_rocm_version: 7.0.2
      become: true
    - role: carlosroman.1password
      tags: [1password]
      become: true
